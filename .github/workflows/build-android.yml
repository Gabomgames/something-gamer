name: Gerar APK do SG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'build-info.json'
      - '.github/workflows/build-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    # secrets não pode ser lido dentro de "if:" de step; por isso vira env do job.
    env:
      TEM_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Assina de verdade quando o keystore está nos secrets do repositório.
      # Sem ele o APK sai instalável para teste, mas nunca depurável.
      - name: Preparar keystore
        if: env.TEM_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sg.keystore"

      - name: Montar APK de release
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/sg.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Mostrar o APK gerado
        working-directory: android-app
        run: |
          set -e
          ls -la app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ "$TEM_KEYSTORE" != "true" ]; then
            echo "::warning::APK assinado com a chave de debug. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD para publicar na Play Store."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Something-Gamer-APK
          path: android-app/app/build/outputs/apk/release/*.apk
