name: Publicar SG no Firebase
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Nada é publicado com JavaScript quebrado.
      - name: Verificar antes de publicar
        run: node scripts/verificar.mjs

      - name: Instalar dependências do build
        run: npm ci || npm install

      # O Hosting serve dist/, que é o fonte empacotado e ofuscado.
      - name: Montar o dist
        run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm install --global firebase-tools
      - name: Instalar dependências das functions
        working-directory: functions
        run: npm ci || npm install
      - run: firebase deploy --only hosting,firestore:rules,firestore:indexes,storage,functions --project something-gamer
