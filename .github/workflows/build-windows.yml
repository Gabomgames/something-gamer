name: Gerar aplicativo do SG para Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/build-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Something-Gamer-Windows
          path: desktop-app/dist/*.exe
